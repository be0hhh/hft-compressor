name: local-ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: /home/gha-runner/github-actions/bin/gha-heavy-shell {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /home/gha-runner/github-actions/cache/ccache
  CCACHE_MAXSIZE: 15G
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  PATH: /usr/bin:/bin:/usr/sbin:/sbin

jobs:
  resolve-family-revisions:
    name: resolve-family-revisions
    runs-on: [self-hosted, linux, x64, wsl, benchmark, hft-bench, hft-compressor]
    timeout-minutes: 10
    outputs:
      cxetcpp_sha: ${{ steps.snapshot.outputs.cxetcpp_sha }}
    steps:
      - name: Checkout revision resolver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: main
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: .github/actions/resolve-family-revisions
          persist-credentials: false

      - name: Snapshot family main revisions
        id: snapshot
        uses: ./.github/actions/resolve-family-revisions
        with:
          family-read-token: ${{ secrets.CI_FAMILY_READ_TOKEN }}

  portable-clang:
    name: portable-clang
    needs: resolve-family-revisions
    runs-on: [self-hosted, linux, x64, wsl, local-ci, hft-compressor]
    timeout-minutes: 180

    steps:
      - name: Checkout canonical CXET toolchain owner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.resolve-family-revisions.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: source/CXETCPP
          submodules: false
          sparse-checkout: |
            .github/actions/setup-toolchain
            cmake
            tools/Toolchain
          persist-credentials: false

      - name: Checkout triggering hft-compressor revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: source/CXETCPP/apps/hft-compressor
          persist-credentials: false

      - name: Record source revisions
        run: |
          {
            echo '### Source revisions'
            printf -- '- CXETCPP: `%s`\n' "$(git -C source/CXETCPP rev-parse HEAD)"
            printf -- '- hft-compressor: `%s`\n' "$(git -C source/CXETCPP/apps/hft-compressor rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Set up pinned LLVM
        uses: ./source/CXETCPP/.github/actions/setup-toolchain
        with:
          source-root: source/CXETCPP
          local-cache-root: /home/gha-runner/github-actions/cache/toolchains/wsl-ci-cxetcpp

      - name: Report CMake and CTest binaries
        run: |
          /usr/bin/cmake --version
          /usr/bin/ctest --version

      - name: Configure portable Clang build
        working-directory: source/CXETCPP/apps/hft-compressor
        run: >-
          /usr/bin/cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DHFT_COMPRESSOR_PORTABLE_BUILD=ON
          -DHFT_COMPRESSOR_BUILD_CLI=ON
          -DHFT_COMPRESSOR_BUILD_TESTS=ON

      - name: Build library, CLI, and offline tests
        working-directory: source/CXETCPP/apps/hft-compressor
        run: /usr/bin/cmake --build build --parallel 4

      - name: Run offline tests
        working-directory: source/CXETCPP/apps/hft-compressor
        run: >-
          /usr/bin/ctest
          --test-dir build
          --output-on-failure
          --no-tests=error
          --timeout 180
